services:
  brazil-travels:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_STORAGE_MODE: ${VITE_STORAGE_MODE:-sheets}
        VITE_GOOGLE_APPS_SCRIPT_URL: ${VITE_GOOGLE_APPS_SCRIPT_URL:-}
        VITE_GOOGLE_API_KEY: ${VITE_GOOGLE_API_KEY:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_GOOGLE_DRIVE_FOLDER_ID: ${VITE_GOOGLE_DRIVE_FOLDER_ID:-}
        VITE_GOOGLE_SHEETS_SPREADSHEET_ID: ${VITE_GOOGLE_SHEETS_SPREADSHEET_ID:-}
    container_name: brazil_travels_kiosk
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
